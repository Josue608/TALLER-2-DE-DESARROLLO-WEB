<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Formulario de registro para nuevos usuarios de la plataforma." />
  <title>Registro de Usuario</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .wrapper { width: 100%; max-width: 440px; }

    header { margin-bottom: 1.5rem; }
    header h1 { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
    header p { font-size: 14px; color: #888; }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 1.5rem;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }

    .req { color: #e24b4a; }

    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      outline: none;
      color: #1a1a1a;
    }

    input:focus, select:focus { border-color: #999; }
    input:user-invalid { border-color: #e24b4a; }

    .hint { font-size: 12px; color: #bbb; margin-top: 3px; }

    input[type="range"] {
      width: 100%;
      accent-color: #1a1a1a;
      margin-top: 4px;
    }

    select { appearance: none; cursor: pointer; }
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      pointer-events: none;
    }

    .check-group { display: flex; flex-direction: column; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .check-item input { width: auto; accent-color: #1a1a1a; }

    hr { border: none; border-top: 1px solid #eee; margin: 1.25rem 0; }

    .btn {
      width: 100%;
      padding: 0.7rem;
      background: #1a1a1a;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.85; }

    footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 12px;
      color: #aaa;
    }
    footer a { color: #555; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="wrapper">

    <header>
      <h1>Crea tu cuenta</h1>
      <p>Completa el formulario para unirte a la plataforma.</p>
    </header>

    <main>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title" style="font-size:13px; color:#888; font-weight:500; margin-bottom:1.25rem;">Datos del registro</h2>

        <form id="registro">

          <div class="field">
            <label for="email">Correo electrónico <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required aria-describedby="email-hint" />
            <p class="hint" id="email-hint">Te enviaremos la confirmación aquí.</p>
          </div>

          <div class="field">
            <label for="password">Contraseña <span class="req" aria-hidden="true">*</span></label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8" aria-describedby="pwd-hint" />
            <p class="hint" id="pwd-hint">Usa letras, números y símbolos.</p>
          </div>

          <div class="field">
            <label for="edad">Edad</label>
            <input type="range" id="edad" name="edad" min="13" max="80" value="22" step="1" aria-valuemin="13" aria-valuemax="80" />
            <p class="hint">Desliza para seleccionar tu edad.</p>
          </div>

          <hr />

          <div class="field">
            <label for="pais">País de residencia</label>
            <div class="select-wrap">
              <select id="pais" name="pais" autocomplete="country">
                <option value="">— Selecciona un país —</option>
                <option value="EC">Ecuador</option>
                <option value="CO">Colombia</option>
                <option value="MX">México</option>
                <option value="AR">Argentina</option>
                <option value="ES">España</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>Intereses <span style="color:#bbb; font-weight:400;">(opcional)</span></label>
            <div class="check-group" role="group" aria-label="Selecciona tus intereses">
              <label class="check-item">
                <input type="checkbox" name="intereses" value="diseno" />
                Diseño y creatividad
              </label>
              <label class="check-item">
                <input type="checkbox" name="intereses" value="dev" />
                Desarrollo web
              </label>
              <label class="check-item">
                <input type="checkbox" name="intereses" value="ia" />
                Inteligencia artificial
              </label>
            </div>
          </div>

          <button class="btn" type="submit">Crear cuenta</button>
        </form>
      </section>
    </main>

    <footer>
      <p>¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
    </footer>

  </div>

</body>
</html>
